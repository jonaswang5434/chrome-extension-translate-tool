<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>扩展设置</title>
</head>
<body style="padding: 20px; font-family: sans-serif; color: #2d3748;">
    <h3>AI 英语学习助手设置</h3>
    
    <label for="apiKey">DeepSeek API Key:</label><br>
    <div style="display: flex; gap: 8px; margin-top: 8px; align-items: center;">
        <input type="password" id="apiKey" style="width: 300px; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px;" placeholder="请输入你的 API Key">
        <!-- 显示/隐藏密码按钮 -->
        <button id="toggleVisibleBtn" type="button" style="padding: 6px 12px; cursor: pointer; border: 1px solid #cbd5e0; background: #edf2f7; border-radius: 4px;">👁️ 显示</button>
    </div>

    <button id="saveBtn" style="margin-top: 14px; padding: 6px 16px; background: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer;">保存设置</button>
    <span id="statusMsg" style="margin-left: 10px; font-size: 13px; color: #38a169;"></span>

    <script src="options.js"></script>
</body>
</html>
